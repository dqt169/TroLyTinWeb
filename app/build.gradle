plugins { id 'com.android.application' }

android {
  namespace 'com.trolytinweb.app'
  compileSdk 35

  defaultConfig {
    applicationId 'com.trolytinweb.app'
    minSdk 24
    targetSdk 35
    versionCode 2
    versionName '2.0.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "androidx.work:work-runtime:2.11.2"
}
